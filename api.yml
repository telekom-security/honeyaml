- path: /auth
  path_type: authenticator
  method: POST
  authorization: jwt
  auth_config:
    issuer: Org
    subject: MyApp
    audience: MyApp
  accounts:
    - username: user
      password: 123456
    - username: monitor
      password: monitor
    - username: admin
      password: admin
      realm: admin
    - username: root
      password: root
      realm: admin

